name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt
  IMAGE_NAME: opik-guardrail-webhook
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  check-ci:
    name: Verify CI passed for this commit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Check latest CI run for current commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          CONCLUSION=$(gh run list --workflow=ci.yml --commit "$SHA" --json conclusion --jq '.[0].conclusion // "missing"')
          if [ "$CONCLUSION" != "success" ]; then
            echo "CI has not passed for $SHA (conclusion: $CONCLUSION). Refusing to release." >&2
            exit 1
          fi

  tag-and-release:
    name: Tag and Release
    runs-on: ubuntu-latest
    needs: [check-ci]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute next version
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1); MINOR=$(echo "$VERSION" | cut -d. -f2); PATCH=$(echo "$VERSION" | cut -d. -f3)
          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
            *) echo "ERROR: unknown bump_type '$BUMP_TYPE'" >&2; exit 1 ;;
          esac
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
      - name: Push tag
        shell: bash
        run: |
          git tag "${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"
      - name: Create GitHub Release
        run: gh release create "${{ steps.version.outputs.new_tag }}" --generate-notes --title "${{ steps.version.outputs.new_tag }}"
        env:
          GH_TOKEN: ${{ github.token }}

  build-push:
    name: Build and Push
    needs: [tag-and-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for GCP Workload Identity Federation
    env:
      NEW_TAG: ${{ needs.tag-and-release.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.NEW_TAG }}

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          token_format: "access_token"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: australia-southeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Strip v prefix from tag
        id: version
        run: echo "value=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: server/
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  create-release:
    name: Update Release with Image Location
    needs: [tag-and-release, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Update release notes with image location
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.tag-and-release.outputs.new_tag }}
        run: |
          set -euo pipefail
          VERSION="${NEW_TAG#v}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          EXISTING=$(gh release view "${NEW_TAG}" --json body -q .body)
          printf '%s\n\n## Docker Image\n\n- `%s`\n' "$EXISTING" "$IMAGE" | gh release edit "${NEW_TAG}" --notes-file -
