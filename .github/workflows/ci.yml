name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r server/requirements.txt
      - run: python -c "import sys; sys.path.insert(0, 'server'); import main"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: server/
          push: false
          load: true
          tags: opik-guardrail-webhook:ci
      # Loading (rather than only building to the cache) and running the
      # image here is what actually exercises the distroless/venv wiring:
      # a `docker build` alone doesn't catch an interpreter-path or
      # file-ownership mistake that only breaks at container start.
      - name: Smoke-test the built image
        run: |
          docker run -d --name smoke -p 8000:8000 opik-guardrail-webhook:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/docs >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker logs smoke
          curl -fsS http://localhost:8000/docs >/dev/null
          docker rm -f smoke

  # Builds and pushes the image only when a commit lands on main (i.e. a merge),
  # never on pull_request pushes.
  # Requires two repo secrets before this job can run:
  #   - secrets.WIF_PROVIDER (Workload Identity Federation provider)
  #   - secrets.WIF_SERVICE_ACCOUNT (service account with Artifact Registry Writer on
  #     australia-southeast1-docker.pkg.dev/field-engineering-apac)
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/opik-guardrail-webhook
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@v4
        with:
          registry: australia-southeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: server/
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
